services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # No environment: block. Configuration comes from .env, which is bind-mounted.
    # Variables set here would land in $_SERVER and override phpunit.xml's <env>,
    # which is how the test suite ended up pointed at the development database.
    networks:
      - buggy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - buggy

  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: buggy
      POSTGRES_USER: buggy
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buggy -d buggy"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - buggy

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    networks:
      - buggy

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8027:8025"
      - "1027:1025"
    networks:
      - buggy


  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    networks:
      - buggy

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # Notification digests are sent by a scheduled command, so without this they
    # accumulate in pending_notifications and nothing is ever delivered.
    command: php artisan schedule:work
    networks:
      - buggy

volumes:
  postgres-data:
  redis-data:

networks:
  buggy:
    driver: bridge
